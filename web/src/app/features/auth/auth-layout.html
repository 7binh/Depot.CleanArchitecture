<main class="flex min-h-screen items-center justify-center p-4 sm:p-8">
  <div class="grid w-full max-w-5xl gap-3 md:grid-cols-2">
    <aside
      class="hidden flex-col justify-between gap-12 rounded-card bg-brand p-8 text-on-brand md:flex"
    >
      <span class="flex size-9 items-center justify-center rounded-field bg-surface text-ink">
        <app-icon name="box" [size]="20" />
      </span>
      <div class="flex flex-col gap-2">
        <h2 class="text-section">{{ promoTitle }}</h2>
        <p class="text-small text-on-brand/85">{{ promoText }}</p>
      </div>
    </aside>

    <section class="flex flex-col gap-8 rounded-card border border-line p-6 sm:p-12">
      <app-brand />
      <router-outlet />
    </section>
  </div>
</main>
