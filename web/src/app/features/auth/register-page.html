<header class="flex flex-col gap-2">
  <h1 class="text-title text-ink">Tạo tài khoản</h1>
  <p class="text-body text-ink-2">Điền thông tin bên dưới để bắt đầu.</p>
</header>

<form [formGroup]="form" (ngSubmit)="submit()" novalidate class="flex flex-col gap-5">
  <app-text-field
    label="Họ và tên"
    icon="user"
    placeholder="Nguyễn Văn A"
    autocomplete="name"
    [control]="form.controls.fullName"
    [messages]="fullNameMessages"
  />
  <app-text-field
    label="Email"
    icon="mail"
    type="email"
    placeholder="ten@congty.vn"
    autocomplete="email"
    [control]="form.controls.email"
    [messages]="emailMessages"
  />
  <app-text-field
    label="Mật khẩu"
    icon="lock"
    type="password"
    placeholder="Ít nhất 8 ký tự"
    autocomplete="new-password"
    [control]="form.controls.password"
    [messages]="passwordMessages"
  />
  <app-text-field
    label="Nhập lại mật khẩu"
    icon="lock"
    type="password"
    placeholder="Nhập lại mật khẩu"
    autocomplete="new-password"
    [control]="form.controls.confirmPassword"
    [messages]="confirmMessages"
  />

  @if (notice(); as message) {
    <p
      role="status"
      class="flex items-start gap-3 rounded-control bg-brand-soft p-4 text-small text-brand"
    >
      <app-icon name="alert-circle" />
      {{ message }}
    </p>
  }

  <button appButton variant="primary" type="submit" class="w-full">Tạo tài khoản</button>
</form>

<p class="text-body text-ink-2">
  Đã có tài khoản?
  <a
    routerLink="/login"
    class="rounded-chip font-medium text-brand hover:underline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand"
  >
    Đăng nhập
  </a>
</p>
