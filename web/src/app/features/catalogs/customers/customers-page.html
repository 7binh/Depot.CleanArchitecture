<app-page-header title="Khách hàng" description="Doanh nghiệp đứng tên trên lệnh cấp container.">
  <button appButton variant="primary" type="button" (click)="creating.set(true)">
    <app-icon name="plus" [size]="16" />
    Thêm khách hàng
  </button>
</app-page-header>

<app-load-state [status]="list.status()" [failure]="list.failure()" (retry)="list.load()">
  @if (list.items().length === 0) {
    <app-empty-state icon="users" message="Chưa có khách hàng nào.">
      <button appButton type="button" (click)="creating.set(true)">
        <app-icon name="plus" [size]="16" />
        Thêm khách hàng
      </button>
    </app-empty-state>
  } @else {
    <app-data-table caption="Danh sách khách hàng" [columns]="columns" [rows]="list.items()" />
  }
</app-load-state>

@if (creating()) {
  <app-create-customer-dialog (closed)="creating.set(false)" (created)="list.load()" />
}
