<app-page-header title="Hãng khai thác" description="Các hãng tàu có container gửi tại bãi.">
  <button appButton variant="primary" type="button" (click)="creating.set(true)">
    <app-icon name="plus" [size]="16" />
    Thêm hãng khai thác
  </button>
</app-page-header>

<app-load-state [status]="list.status()" [failure]="list.failure()" (retry)="list.load()">
  @if (list.items().length === 0) {
    <app-empty-state icon="ship" message="Chưa có hãng khai thác nào.">
      <button appButton type="button" (click)="creating.set(true)">
        <app-icon name="plus" [size]="16" />
        Thêm hãng khai thác
      </button>
    </app-empty-state>
  } @else {
    <app-data-table caption="Danh sách hãng khai thác" [columns]="columns" [rows]="list.items()" />
  }
</app-load-state>

@if (creating()) {
  <app-create-line-operator-dialog (closed)="creating.set(false)" (created)="list.load()" />
}
