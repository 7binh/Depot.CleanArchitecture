<app-page-header
  title="Loại container"
  description="Các loại container bãi đang nhận, như 20GP, 40GP hoặc 40HC."
/>

<app-load-state [status]="list.status()" [failure]="list.failure()" (retry)="list.load()">
  <app-card>
    @if (list.items().length === 0) {
      <app-empty-state icon="layers" message="Chưa có loại container nào." />
    } @else {
      <app-data-table
        caption="Danh sách loại container"
        [columns]="columns"
        [rows]="list.items()"
      />
    }
  </app-card>
</app-load-state>
