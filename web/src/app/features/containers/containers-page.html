<app-page-header
  title="Container"
  description="Container đã đăng ký với bãi, hãng tự suy từ 3 chữ cái đầu."
>
  <button appButton variant="primary" type="button" (click)="creating.set(true)">
    <app-icon name="plus" [size]="16" />
    Thêm container
  </button>
</app-page-header>

<div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-5">
  <app-text-field
    label="Tìm số container"
    icon="search"
    placeholder="Một phần số"
    [control]="filters.controls.number"
  />
  <app-select-field
    label="Hãng"
    placeholder="Tất cả hãng"
    [control]="filters.controls.lineOperatorId"
    [options]="operatorOptions()"
  />
  <app-select-field
    label="Loại"
    placeholder="Tất cả loại"
    [control]="filters.controls.containerTypeId"
    [options]="typeOptions()"
  />
  <app-select-field
    label="Kích cỡ"
    placeholder="Tất cả cỡ"
    [control]="filters.controls.sizeFeet"
    [options]="sizeOptions"
  />
  <app-text-field
    label="Tìm mã ISO"
    icon="search"
    placeholder="Một phần mã"
    [control]="filters.controls.isoCode"
  />
</div>

<app-load-state [status]="list.status()" [failure]="list.failure()" (retry)="list.load()">
  <div>
    @if (list.items().length === 0) {
      @if (filtered()) {
        <app-empty-state icon="box" message="Không có container nào khớp bộ lọc." />
      } @else {
        <app-empty-state icon="box" message="Chưa có container nào.">
          <button appButton type="button" (click)="creating.set(true)">
            <app-icon name="plus" [size]="16" />
            Thêm container
          </button>
        </app-empty-state>
      }
    } @else {
      <div class="overflow-x-auto">
        <app-data-table caption="Danh sách container" [columns]="columns" [rows]="list.items()" />
      </div>
      @if (paging(); as paged) {
        <div class="mt-4">
          <app-pagination
            [page]="paged.page"
            [pageSize]="paged.pageSize"
            [totalCount]="paged.totalCount"
            [totalPages]="paged.totalPages"
            (pageChange)="goTo($event)"
          />
        </div>
      }
    }
  </div>
</app-load-state>

@if (creating()) {
  <app-create-container-dialog (closed)="creating.set(false)" (created)="list.load()" />
}
